domain: INFRA
type: OCIBLOCKSTORE
goldenTags:
- oci.compartmentId
- oci.region
- oci.displayName
- oci.availabilityDomain
- oci.lifecycleState
- oci.sizeInGBs
- oci.timeCreated
- oci.blockVolumeReplicas
configuration:
  entityExpirationTime: DAILY
  alertable: true
synthesis:
  tags:
    newrelic.cloudIntegrations.providerAccountName:
      entityTagNames: [newrelic.cloudIntegrations.providerAccountName, providerAccountName]
      multiValue: false
  rules:
  - ruleName: infra_ociblockstore_oci_resourceId
    identifier: oci.resourceId
    name: oci.resourceId
    legacyFeatures:
      overrideGuidType: true
    encodeIdentifierInGUID: true
    conditions:
    - attribute: oci.resourceId
      prefix: "ocid1.volume"
    - attribute: oci.namespace
      value: "oci_blockstore"
  # Boot volumes emit under oci_blockstore with an ocid1.bootvolume resourceId
  # (verified via `oci monitoring metric list` in cust-1); without this rule they
  # never synthesize.
  - ruleName: infra_ociblockstore_oci_resourceId_bootvolume
    identifier: oci.resourceId
    name: oci.resourceId
    legacyFeatures:
      overrideGuidType: true
    encodeIdentifierInGUID: true
    conditions:
    - attribute: oci.resourceId
      prefix: "ocid1.bootvolume"
    - attribute: oci.namespace
      value: "oci_blockstore"

ownership:
  primaryOwner:
    teamName: "Cloud Monitoring Platform"
