domain: INFRA
type: OCISTREAMING
goldenTags:
- oci.compartmentId
- oci.displayName
- oci.lifecycleState
- oci.region
configuration:
  entityExpirationTime: DAILY
  alertable: true
synthesis:
  tags:
    newrelic.cloudIntegrations.providerAccountName:
      entityTagNames: [newrelic.cloudIntegrations.providerAccountName, providerAccountName]
      multiValue: false
  rules:
  - ruleName: infra_ocistreaming_oci_resourceId
    identifier: oci.resourceId
    name: oci.resourceId
    legacyFeatures:
      overrideGuidType: true
    encodeIdentifierInGUID: true
    conditions:
    # oci_streaming metrics are emitted per-stream with an ocid1.stream resourceId
    # (verified via `oci monitoring metric list` in cust-1); the prior
    # "ocid1.streampool" prefix never matched, so streams never synthesized.
    - attribute: oci.resourceId
      prefix: "ocid1.stream"
    - attribute: oci.namespace
      value: "oci_streaming"
    # New rule for logs
  - ruleName: infra_ocistreaming_logs
    identifier: data.resourceId
    name: source
    legacyFeatures:
      overrideGuidType: true
    encodeIdentifierInGUID: true
    conditions:
    - attribute: eventType
      prefix: Log
    - attribute: data.resourceId
      prefix: "ocid1.streampool"
    - attribute: type
      prefix: "com.oraclecloud.Streaming"
    - attribute: logging.testing.synthesize.oci.entities
      value: "true"  
ownership:
  primaryOwner:
    teamName: "Cloud Monitoring Platform"
